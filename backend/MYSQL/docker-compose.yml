version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: mysql-cookwise
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cookwise
      MYSQL_USER: backend
      MYSQL_PASSWORD: backend
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: